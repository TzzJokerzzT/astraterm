[package]
name = "astraterm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AstraTerm - a lightweight native Rust terminal emulator for Linux"

[[bin]]
name = "astraterm"
path = "src/main.rs"

[dependencies]
astraterm-core = { workspace = true }
astraterm-config = { workspace = true }
astraterm-workspace = { workspace = true }
astraterm-session = { workspace = true }
astraterm-terminal = { workspace = true }
astraterm-pty = { workspace = true }
astraterm-renderer = { workspace = true }
astraterm-settings-ui = { workspace = true }
astraterm-platform = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
crossbeam-channel = { workspace = true }
png = { workspace = true }
pollster = "0.4"
thiserror = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
wgpu = { workspace = true }
winit = { workspace = true }
